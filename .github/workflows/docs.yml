name: Docs Build

on:
  push:
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs

      # The site is served from the root of the custom domain in docs/CNAME,
      # so build with the baseurl from _config.yml (empty).
      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: berkeley-cdss/flextensions

      - name: Check the custom domain is published
        run: |
          expected=$(tr -d '[:space:]' < CNAME)
          actual=$(tr -d '[:space:]' < _site/CNAME)
          if [ "$expected" != "$actual" ]; then
            echo "::error::_site/CNAME ($actual) does not match docs/CNAME ($expected)"
            exit 1
          fi
          echo "Custom domain: $actual"

      - name: Check for broken internal links
        run: |
          # Verify all internal .html files were generated
          echo "Generated site files:"
          find _site -name '*.html' | sort
          echo ""
          echo "Checking for broken internal links..."
          # Extract root-relative href/src values and verify they resolve.
          # Protocol-relative URLs (//example.com) are external, so skip those.
          broken=0
          while read -r path; do
            path=${path%%#*}
            path=${path%%\?*}
            local_path="_site${path}"
            if [ -f "$local_path" ] \
              || [ -f "${local_path%/}/index.html" ] \
              || [ -f "${local_path%/}.html" ]; then
              continue
            fi
            echo "::error::Broken internal link: $path (resolved to $local_path)"
            broken=1
          done < <(grep -rhoP '(?:href|src)="\K/(?!/)[^"]*' _site --include='*.html' | sort -u)
          # Links written without a scheme (e.g. [example.com](example.com))
          # resolve against the current page, which is never what we want.
          while read -r href; do
            echo "::error::Link is not absolute or root-relative: $href"
            broken=1
          done < <(grep -rhoP 'href="\K(?!https?://|//|/|\#|mailto:)[^"]*' _site --include='*.html' | sort -u)
          if [ "$broken" -eq 1 ]; then
            echo "::error::Some internal links are broken. See errors above."
            exit 1
          fi
          echo "All internal links resolve."
