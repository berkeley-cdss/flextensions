# buildspec.yml (Native Ruby Version)
#
# This buildspec installs dependencies and precompiles assets.
# The final artifact is the application source code itself.

version: 0.2

phases:
  install:
    # This MUST match the Elastic Beanstalk platform's Ruby version.
    # The staging and production environments run the "Ruby 3.4 on Amazon
    # Linux 2023" platform branch (currently ruby 3.4.10), so building with
    # any other version breaks deploys. The app already supports Ruby 4.0
    # (the Gemfile allows >= 3.4, < 4.1); bump this to 4.0 only together
    # with the EB platform upgrade to the "Ruby 4.0 on Amazon Linux 2023"
    # branch.
    runtime-versions:
      ruby: 3.4

    commands:
      - echo "Installing system dependencies for build..."
      - sudo dnf install -y postgresql17-devel ImageMagick --allowerasing

      - echo "Installing application dependencies..."
      - gem install bundler
      - bundle config set deployment true
      - bundle config set without 'development test'
      - bundle install

  pre_build:
    commands:
      - echo "Saving git commit info"
      - git rev-parse HEAD > REVISION 2>/dev/null || echo "unknown" > REVISION
      # Stamped into the artifact rather than onto the instance, so every server
      # behind the load balancer reports the same release. Surfaced in the
      # footer and at /status/version; see app/services/deployment_info.rb.
      - date -u +%Y-%m-%dT%H:%M:%SZ > DEPLOYED_AT
      - echo "Pre-compiling assets for production..."
      - export RAILS_ENV=production
      - export SECRET_KEY_BASE=$(bundle exec rails secret)
      - bundle exec rake assets:precompile

  build:
    commands:
      - echo "Build phase complete. Preparing artifacts..."

# The artifact is now the entire application directory.
artifacts:
  files:
    - '**/*'
